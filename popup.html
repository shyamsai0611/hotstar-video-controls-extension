<!DOCTYPE html>
<html>
<head>
    <title>Hotstar Controls</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

   <h2> Hotstar Controls</h2>
<p class="version">Version 6.0</p>

<div class="settings-card">

    <h3> Playback</h3>

    <label>Skip Duration</label>
    <select id="skipTime">
        <option value="5">5 sec</option>
        <option value="10">10 sec</option>
        <option value="30">30 sec</option>
        <option value="60">60 sec</option>
    </select>

    <label>Default Playback Speed</label>
    <select id="playbackSpeed">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="1.75">1.75x</option>
        <option value="2">2x</option>
    </select>

    <h3>Live Stream Controls</h3>

    <label>Live Seek Step</label>
    <select id="liveSeekStep">
        <option value="30">30 sec</option>
        <option value="60" selected>60 sec</option>
        <option value="120">2 min</option>
        <option value="300">5 min</option>
    </select>

    <h3> Audio</h3>

    <label>Volume Step</label>
    <select id="volumeStep">
        <option value="0.05">5%</option>
        <option value="0.1">10%</option>
        <option value="0.2">20%</option>
    </select>

    <h3> Preferences</h3>

    <h3>Shortcuts</h3>

        <p class="shortcut-info">
            M  Mute
            <br>
            F  Fullscreen
            <br>
        </p>

    <div class="checkbox-container">
        <input type="checkbox" id="notifications">
        <label for="notifications">Enable Notifications</label>
    </div>

    <button id="saveBtn"> Save Settings</button>

    <p id="statusMessage"></p>

</div>

<script src="popup.js"></script>

</body>
</html>
